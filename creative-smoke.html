<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RC22 Creative Smoke</title>
  <style>
    body{font-family:Inter,Arial,sans-serif;margin:0;background:#f3f4f6;color:#111827}
    .shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:#111827;color:#fff;padding:18px}.nav{display:grid;gap:8px}.nav button{border:0;border-radius:10px;padding:12px;text-align:left}.main{padding:24px}.container{max-width:1200px}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border-radius:16px;padding:16px}.two{grid-column:1/-1}.pill{padding:4px 7px;border-radius:999px;background:#ede9fe}.muted{color:#64748b}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar"><nav class="nav"><button data-page="dashboard"><span class="ico">◫</span><span class="label">Painel</span></button><button data-page="config"><span class="ico">⚙️</span><span class="label">Configurações</span></button></nav></aside>
    <main class="main"><h1 id="pageTitle">Painel</h1><div class="container"><section class="page active" id="dashboard"><div class="card">Painel base RC22</div></section></div></main>
  </div>
  <div id="toast"></div>
  <script>
    window.__consoleErrors=[];
    const oldError=console.error;console.error=(...a)=>{window.__consoleErrors.push(a.map(String).join(' '));oldError(...a)};
    window.INTORNA_CTX={studioId:'11111111-1111-1111-1111-111111111111',user:{id:'22222222-2222-2222-2222-222222222222'}};
    window.IntornaRC22={version:'22.0.0',open(){},refresh(){}};
    const empty=()=>({data:[],error:null});
    function chain(){
      const c={select(){return c},eq(){return c},order(){return c},limit(){return Promise.resolve(empty())},update(){return c},insert(row){c._row=row;return c},single(){return Promise.resolve({data:{id:'campaign-1',latest_version:0,...(c._row||{})},error:null})}};
      return c;
    }
    window.IntornaCloud={client:{from(){return chain()},auth:{getUser:async()=>({data:{user:{id:window.INTORNA_CTX.user.id}}})}}};
    window.toast=(m)=>{document.getElementById('toast').textContent=m};
    window.goPage=(id)=>{document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));const b=document.querySelector('.nav button[data-page="'+id+'"]');document.getElementById('pageTitle').textContent=b?.querySelector('.label')?.textContent||'Painel'};
    navigator.clipboard={writeText:async()=>{}};
  </script>
  <script src="/app/features-v22-creative.js"></script>
</body>
</html>
