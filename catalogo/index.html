<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b132b">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Catálogo de amostras</title>
<style>
:root{--night:#0b132b;--ink:#111827;--muted:#667085;--line:#e5e7eb;--violet:#7c3aed;--blue:#2563eb;--gold:#f2ba2a;--paper:#f7f8fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}.top{position:relative;overflow:hidden;padding:54px 0 46px;background:radial-gradient(circle at 85% 15%,#7c3aed80,transparent 34%),linear-gradient(135deg,#071027,#17225b);color:#fff}.top:after{content:"";position:absolute;inset:auto -10% -120px; height:180px;background:#fff1;transform:rotate(-4deg)}.brand{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand img{width:178px;max-height:48px;object-fit:contain;object-position:left;filter:brightness(0) invert(1)}.sample{padding:7px 11px;border:1px solid #ffffff40;border-radius:999px;background:#ffffff12;font-size:11px;font-weight:900;letter-spacing:.08em}.hero{position:relative;z-index:1;max-width:760px;margin-top:58px}.eyebrow{color:#fcd34d;font-size:11px;font-weight:950;letter-spacing:.12em;text-transform:uppercase}.hero h1{margin:10px 0 12px;font-size:clamp(34px,6vw,66px);line-height:1.02;letter-spacing:-.04em}.hero p{max-width:680px;margin:0;color:#d9def3;font-size:clamp(15px,2vw,19px);line-height:1.65}.hero-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.tag{display:inline-flex;padding:8px 11px;border:1px solid #ffffff2b;border-radius:999px;background:#ffffff10;font-size:12px;font-weight:800}.main{padding:30px 0 110px}.toolbar{position:sticky;top:10px;z-index:10;margin-bottom:22px;padding:12px;border:1px solid var(--line);border-radius:18px;background:#ffffffed;box-shadow:0 12px 35px #0f172a12;backdrop-filter:blur(14px)}.filters{display:flex;gap:8px;overflow:auto;scrollbar-width:thin}.filter{flex:0 0 auto;padding:9px 13px;border:0;border-radius:999px;background:#eef2f7;color:#334155;font:inherit;font-size:12px;font-weight:900;cursor:pointer}.filter.active{background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff}.count{margin:12px 2px 0;color:var(--muted);font-size:12px}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{position:relative;overflow:hidden;border-radius:22px;background:#e7e9f0;box-shadow:0 12px 30px #0f172a15;cursor:pointer;isolation:isolate}.card img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;transition:transform .35s ease}.card:hover img{transform:scale(1.025)}.shade{position:absolute;inset:auto 0 0;padding:62px 16px 16px;background:linear-gradient(transparent,#050817d9);color:#fff}.shade b{display:block;font-size:15px}.shade small{display:block;margin-top:3px;color:#d9def3}.watermark{position:absolute;left:50%;top:50%;width:max-content;max-width:90%;transform:translate(-50%,-50%) rotate(-24deg);color:#fff;border:2px solid #ffffffa8;padding:8px 13px;border-radius:7px;background:#0003;text-shadow:0 2px 8px #000;font-size:clamp(13px,2vw,22px);font-weight:950;letter-spacing:.12em;pointer-events:none}.empty,.state{grid-column:1/-1;padding:64px 24px;border:1px dashed #cbd5e1;border-radius:22px;background:#fff;text-align:center;color:var(--muted)}.state{min-height:330px;display:grid;place-items:center}.spinner{width:34px;height:34px;margin:0 auto 16px;border:3px solid #e2e8f0;border-top-color:var(--violet);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.wa{position:fixed;z-index:30;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);display:none;align-items:center;justify-content:center;gap:9px;width:min(460px,calc(100% - 28px));padding:15px 20px;border:0;border-radius:16px;background:#16a34a;color:#fff;box-shadow:0 14px 36px #14532d57;font:inherit;font-weight:950;text-decoration:none}.lightbox{position:fixed;z-index:50;inset:0;display:none;place-items:center;padding:18px;background:#020617ed}.lightbox.open{display:grid}.lightbox-inner{width:min(960px,100%);max-height:calc(100vh - 36px);display:grid;grid-template-columns:minmax(0,1fr) 310px;overflow:hidden;border-radius:22px;background:#fff}.preview{position:relative;display:grid;place-items:center;min-height:440px;background:#080b14}.preview img{display:block;max-width:100%;max-height:calc(100vh - 36px);object-fit:contain}.details{display:flex;flex-direction:column;padding:24px}.details h2{margin:6px 0 7px}.details p{color:var(--muted);line-height:1.55}.details .choose{margin-top:auto;padding:14px;border:0;border-radius:13px;background:#16a34a;color:#fff;font:inherit;font-weight:950;cursor:pointer}.close{position:absolute;z-index:2;top:12px;right:12px;width:40px;height:40px;border:0;border-radius:50%;background:#fff;color:#111827;font-size:20px;cursor:pointer}.footer{padding:28px 0 110px;color:#64748b;text-align:center;font-size:12px}.footer a{color:#475569}.error-icon{font-size:38px}.retry{margin-top:14px;padding:10px 14px;border:0;border-radius:10px;background:var(--night);color:#fff;font-weight:900;cursor:pointer}
@media(max-width:840px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.lightbox-inner{grid-template-columns:1fr;overflow:auto}.preview{min-height:0}.preview img{max-height:65vh}.details{min-height:180px}.details .choose{margin-top:16px}}
@media(max-width:520px){.wrap{width:min(100% - 22px,1180px)}.top{padding:30px 0 38px}.brand img{width:145px}.hero{margin-top:40px}.gallery{gap:10px}.card{border-radius:15px}.shade{padding:50px 11px 11px}.shade b{font-size:12px}.shade small{font-size:10px}.toolbar{top:6px}.main{padding-top:18px}.watermark{font-size:10px;padding:6px 8px;border-width:1px}}
</style>
</head>
<body>
<header class="top" id="hero" hidden>
 <div class="wrap">
  <div class="brand"><img src="/assets/logo.svg" alt="Intorná Pixels"><span class="sample">CATÁLOGO DE AMOSTRAS</span></div>
  <div class="hero"><div class="eyebrow" id="studioName">Estúdio</div><h1 id="catalogTitle">Modelos de ensaio</h1><p id="catalogDescription"></p><div class="hero-meta"><span class="tag" id="catalogType"></span><span class="tag" id="catalogTotal"></span></div></div>
 </div>
</header>
<main class="main"><div class="wrap">
 <div class="state" id="status"><div><div class="spinner"></div><b>Abrindo o catálogo…</b><p>Estamos preparando os modelos para você.</p></div></div>
 <div id="content" hidden><div class="toolbar"><div class="filters" id="filters"></div><div class="count" id="visibleCount"></div></div><div class="gallery" id="gallery"></div></div>
</div></main>
<a class="wa" id="whatsapp" target="_blank" rel="noopener noreferrer"><span>💬</span><span>Falar sobre estes modelos</span></a>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Modelo selecionado"><div class="lightbox-inner"><div class="preview"><button class="close" id="close" aria-label="Fechar">×</button><img id="lightboxImage" alt=""><span class="watermark" id="lightboxWatermark" hidden></span></div><div class="details"><small class="eyebrow" id="lightboxType"></small><h2 id="lightboxTitle"></h2><p id="lightboxDescription"></p><button class="choose" id="choose">💬 Gostei deste modelo</button></div></div></div>
<footer class="footer"><div class="wrap">Catálogo protegido e apresentado com <a href="/" target="_blank" rel="noopener">Intorná Pixels</a>.</div></footer>
<script src="/shared/supabase-config.js?v=22.5.0"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),state={payload:null,filter:'Todos',selected:null};
const safe=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const token=new URLSearchParams(location.search).get('c')||'';
function normalizedPhone(v){return String(v||'').replace(/\D/g,'')}
function whatsappUrl(item){const p=state.payload,base=p.catalog.whatsappMessage||'Olá! Vi o catálogo de amostras e gostaria de saber mais sobre os ensaios.';const chosen=item?`\n\nGostei deste modelo: ${item.title} (${item.essayType}).`:'';const phone=normalizedPhone(p.studio.whatsapp);return `https://wa.me/${phone}?text=${encodeURIComponent(base+chosen+`\n\nCatálogo: ${location.href}`)}`}
function showError(message){$('hero').hidden=true;$('content').hidden=true;$('status').hidden=false;$('status').innerHTML=`<div><div class="error-icon">📖</div><h2>Catálogo indisponível</h2><p>${safe(message)}</p><button class="retry" onclick="location.reload()">Tentar novamente</button></div>`}
function renderFilters(){const types=['Todos',...new Set(state.payload.items.map(x=>x.essayType).filter(Boolean))];$('filters').innerHTML=types.map(x=>`<button class="filter ${x===state.filter?'active':''}" data-filter="${safe(x)}">${safe(x)}</button>`).join('');$('filters').querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;renderFilters();renderGallery()})}
function renderGallery(){const items=state.payload.items.filter(x=>state.filter==='Todos'||x.essayType===state.filter);$('visibleCount').textContent=`${items.length} modelo${items.length===1?'':'s'} ${state.filter==='Todos'?'disponíveis':`em ${state.filter}`}`;$('gallery').innerHTML=items.length?items.map(x=>`<article class="card" tabindex="0" role="button" data-id="${x.id}" aria-label="Abrir ${safe(x.title)}"><img src="${safe(x.imageUrl)}" alt="${safe(x.title)}" loading="lazy">${state.payload.catalog.watermarkEnabled?`<span class="watermark">${safe(state.payload.catalog.watermarkText||'AMOSTRA')}</span>`:''}<div class="shade"><b>${safe(x.title)}</b><small>${safe(x.essayType)}</small></div></article>`).join(''):'<div class="empty">Nenhum modelo nesta categoria.</div>';$('gallery').querySelectorAll('[data-id]').forEach(card=>{const open=()=>openItem(card.dataset.id);card.onclick=open;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}})}
function openItem(id){const item=state.payload.items.find(x=>x.id===id);if(!item)return;state.selected=item;$('lightboxImage').src=item.imageUrl;$('lightboxImage').alt=item.title;$('lightboxType').textContent=item.essayType;$('lightboxTitle').textContent=item.title;$('lightboxDescription').textContent=item.description||'Use este modelo como referência para conversar com o estúdio.';$('lightboxWatermark').textContent=state.payload.catalog.watermarkText||'AMOSTRA';$('lightboxWatermark').hidden=!state.payload.catalog.watermarkEnabled;$('lightbox').classList.add('open');document.body.style.overflow='hidden';$('close').focus()}
function closeItem(){$('lightbox').classList.remove('open');document.body.style.overflow='';state.selected=null}
function render(payload){state.payload=payload;document.title=`${payload.catalog.title} — ${payload.studio.name}`;$('studioName').textContent=payload.studio.name;$('catalogTitle').textContent=payload.catalog.title;$('catalogDescription').textContent=payload.catalog.description||'Conheça os modelos e escolha o estilo que mais combina com você.';$('catalogType').textContent=payload.catalog.type;$('catalogTotal').textContent=`${payload.items.length} modelo${payload.items.length===1?'':'s'}`;$('status').hidden=true;$('hero').hidden=false;$('content').hidden=false;renderFilters();renderGallery();$('whatsapp').href=whatsappUrl();$('whatsapp').style.display='flex'}
async function load(){if(!/^[0-9a-f-]{36}$/i.test(token))return showError('O link está incompleto ou inválido. Peça um novo link ao estúdio.');try{const cfg=window.INTORNA_BACKEND||{};if(!cfg.supabaseUrl||!cfg.supabasePublishableKey)throw new Error('Configuração indisponível.');const response=await fetch(`${cfg.supabaseUrl}/functions/v1/public-catalog`,{method:'POST',headers:{'Content-Type':'application/json','apikey':cfg.supabasePublishableKey,'Authorization':`Bearer ${cfg.supabasePublishableKey}`},body:JSON.stringify({token})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Não foi possível abrir este catálogo.');render(data)}catch(error){showError(error.message||'Não foi possível abrir este catálogo agora.')}}
$('close').onclick=closeItem;$('lightbox').onclick=e=>{if(e.target===$('lightbox'))closeItem()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeItem()});$('choose').onclick=()=>{if(state.selected)window.open(whatsappUrl(state.selected),'_blank','noopener,noreferrer')};load();
})();
</script>
<script>if('serviceWorker'in navigator){navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'}).catch(()=>{})}</script>
</body>
</html>
